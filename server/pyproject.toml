[project]
name = "placement-portal-backend"
version = "0.1.0"
description = "Backend for Placement Portal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.2",
    "python-dotenv>=1.0.0",
    "flask>=3.1.3",
    "flask-jwt-extended>=4.6.0",
    "flask-mail>=0.10.0",
    "flask-sqlalchemy>=3.1.1",
    "ruff>=0.15.5",
]

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = [
    ".git",
    ".mypy_cache",
    "__pycache__",
    ".venv",
    ".env",
    "env",
    "venv",
    "build",
    "dist",
    "migrations",
    "*/migrations/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "DJ", "S", "C4"]
ignore = [
    "S101", 
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.uv]
package = false
